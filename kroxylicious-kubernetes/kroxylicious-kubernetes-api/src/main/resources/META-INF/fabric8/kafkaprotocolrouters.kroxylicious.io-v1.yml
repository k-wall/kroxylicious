# Note the v1 in the filename refers to the version of the CustomResourceDefinition
# not any of the versions of API being defined.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: kafkaprotocolrouters.kroxylicious.io
spec:
  # group name to use for REST API: /apis/<group>/<version>
  group: kroxylicious.io
  scope: Namespaced
  names:
    plural: kafkaprotocolrouters
    singular: kafkaprotocolrouter
    kind: KafkaProtocolRouter
    shortNames:
      - kpr
    categories:
      - kroxylicious
  # list of versions supported by this CustomResourceDefinition
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ResolvedRefs
          description: Whether the other resources referenced by this protocol router can be found.
          jsonPath: ".status.conditions[?(@.type==\"ResolvedRefs\")].status"
          type: string
          priority: 0
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                self.spec.routes.all(r,
                  !(r.targetRef.kind == 'KafkaProtocolRouter' && r.targetRef.name == self.metadata.name))
              message: "a route may not target its own enclosing KafkaProtocolRouter"
          properties:
            metadata:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 63
                  pattern: "[a-z0-9]([a-z0-9-]*[a-z0-9])?"
            spec:
              type: object
              required:
                - type
                - routes
              x-kubernetes-validations:
                - rule: "self.routes.size() >= 1"
                  message: "a router must have at least one route"
                - rule: "self.routes.all(r, r.id >= 0)"
                  message: "route ids must be non-negative"
                - rule: "self.routes.all(r, r.id < self.routes.size())"
                  message: "route ids must be less than the number of routes (no gaps)"
                - rule: "self.routes.all(r, self.routes.filter(s, s.id == r.id).size() == 1)"
                  message: "route ids must be unique within the router"
              properties:
                type:
                  description: The Java class name of the router factory implementation.
                  type: string
                configTemplate:
                  description: The router's configuration, subject to config provider interpolation.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                routes:
                  description: |
                    The routes declared by this router. Must contain at least one entry.
                    Route ids must be non-negative, unique, and form the contiguous set {0, 1, …, N-1}.
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [ "name", "id", "targetRef" ]
                    properties:
                      name:
                        description: Human-readable route name, used as the route name in the proxy RouteDefinition.
                        type: string
                        minLength: 1
                        maxLength: 253
                      id:
                        description: |
                          Stable zero-based identifier for this route within the router.
                          Used in the virtual node ID mapping formula: virtualNodeId = route.id + (numberOfRoutes × targetBrokerNodeId).
                          Changing or removing an id invalidates node-ID state held by connected clients.
                        type: integer
                        minimum: 0
                      filterRefs:
                        description: Ordered list of KafkaProtocolFilter references applied on this route.
                        type: array
                        items:
                          type: object
                          required: [ "name" ]
                          properties:
                            name:
                              maxLength: 253
                              minLength: 1
                              type: string
                      targetRef:
                        description: |
                          The upstream target for this route.
                          Must reference either a KafkaService (leaf target) or a KafkaProtocolRouter (nested routing).
                        type: object
                        required: [ "kind", "name" ]
                        properties:
                          group:
                            description: The API group of the target resource. Must be 'kroxylicious.io' if specified.
                            type: string
                            pattern: ^kroxylicious[.]io$
                          kind:
                            description: The kind of the target resource.
                            type: string
                            enum: [ "KafkaService", "KafkaProtocolRouter" ]
                          name:
                            description: The name of the target resource.
                            type: string
                            minLength: 1
                            maxLength: 253
            status:
              type: object
              properties:
                observedGeneration:
                  description: |
                    The metadata.generation that was observed during the last reconciliation by the operator.
                  type: integer
                conditions:
                  # Mapped to Java type io.kroxylicious.kubernetes.api.common.Condition
                  type: array
                  items:
                    type: object
                    properties:
                      lastTransitionTime:
                        description: |
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.
                          If that is not known, then using the time when the API field changed is acceptable.
                        type: string
                        format: date-time
                      message:
                        description: |
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        type: string
                        default: ""
                        nullable: false
                      observedGeneration:
                        description: |
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the
                          .status.conditions[x].observedGeneration is 9, the condition is out of date with
                          respect to the current state of the instance.
                        type: integer
                        nullable: false
                      reason:
                        description: |
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        type: string
                        nullable: false
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                        enum: [ "True", "False", "Unknown" ]
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        type: string
                    required:
                      - lastTransitionTime
                      - observedGeneration
                      - reason
                      - message
                      - type
          required:
            - spec
